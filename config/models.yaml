# Logical model catalog. The Gateway resolves logical names to provider/endpoint.
# All providers must be OpenAI-compatible.
chat:
  default: chat-strong
  models:
    chat-strong:
      provider: openai
      endpoint: https://api.openai.com/v1
      model_id: gpt-4o
    chat-fast:
      provider: openai
      endpoint: https://api.openai.com/v1
      model_id: gpt-4o-mini
    chat-local:
      provider: ollama
      endpoint: http://ollama:11434/v1
      model_id: qwen2.5-coder:32b

embedding:
  default: embed-default
  models:
    embed-default:
      provider: openai
      endpoint: https://api.openai.com/v1
      model_id: text-embedding-3-small
    embed-local:
      provider: ollama
      endpoint: http://ollama:11434/v1
      model_id: nomic-embed-text

transcription:
  default: stt-default
  models:
    stt-default:
      provider: openai
      endpoint: https://api.openai.com/v1
      model_id: gpt-4o-mini-transcribe
    stt-whisper:
      provider: openai
      endpoint: https://api.openai.com/v1
      model_id: whisper-1
    # Audio-in delivery analysis. Must be a multimodal *chat* model that
    # accepts an "input_audio" message part (gpt-4o-audio-preview,
    # gpt-4o-mini-audio-preview, etc.). If you don't configure this entry
    # the gateway will transparently fall back to stt-default + a chat
    # model for delivery scoring (lower fidelity, but it works).
    voice-analysis-default:
      provider: openai
      endpoint: https://api.openai.com/v1
      model_id: gpt-4o-mini-audio-preview
