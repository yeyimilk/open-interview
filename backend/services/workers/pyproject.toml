[project]
name = "openinterview-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "arq>=0.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "openinterview-schemas",
  "openinterview-storage",
  "openinterview-logging",
  "openinterview-db",
  "openinterview-core",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
